name: Sign macOS installer
on:
  workflow_dispatch:
    inputs:
      desktop_candidate:
        description: Build and sign the reviewed shared desktop candidate
        type: boolean
        default: false
      release_tag:
        description: Existing release containing the universal ZIP
        required: true
        default: v0.1.0
        type: string
      source_sha256:
        description: Expected SHA-256 of the source universal ZIP
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sign-macos-installer
  cancel-in-progress: false
jobs:
  desktop:
    if: inputs.desktop_candidate
    uses: ./.github/workflows/sign-desktop-macos.yml
    secrets: inherit
  sign:
    if: ${{ !inputs.desktop_candidate }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact release input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          [[ "$SOURCE_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Expected installer ZIP digest required' >&2; exit 1; }
          mkdir -p build-signing/input
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern YuanAssistant-Setup-macos-universal.zip --dir build-signing/input; then
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
            --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run_id" ]] || { echo "No successful installer build for $RELEASE_TAG ($commit)" >&2; exit 1; }
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name macos-universal --dir build-signing/input
      - name: Sign and verify distribution
        env:
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/import-macos-signing.sh
      - name: Launch signed application
        run: |
          "build-signing/app/原助理安装向导.app/Contents/MacOS/原助理安装向导" &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill -TERM "$app_pid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed
          path: packages/*
          if-no-files-found: error
